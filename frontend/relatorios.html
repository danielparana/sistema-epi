<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - EPI Fácil</title>

    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="header-left">
            <span class="logo-text">EPI Fácil</span>
            <span class="system-title">Sistema de Controle de EPIs</span>
        </div>
        <div class="header-right">
            <i class="fa-regular fa-circle-question header-icon" title="Ajuda"></i>
            <div class="dropdown-wrapper">
                <i class="fa-solid fa-gear header-icon" id="settingsBtn" title="Configurações"></i>
                <div class="dropdown-menu" id="settingsDropdown">
                    <a href="#"><i class="fa-solid fa-sliders"></i> Preferências</a>
                    <a href="#"><i class="fa-solid fa-lock"></i> Segurança</a>
                    <a href="#"><i class="fa-solid fa-database"></i> Backup de Dados</a>
                </div>
            </div>
            <div class="dropdown-wrapper">
                <div class="user-avatar" id="profileBtn" title="Perfil do Usuário"></div>
                <div class="dropdown-menu dropdown-right" id="profileDropdown">
                    <div class="user-info-header">
                        <strong id="userName">João Silva</strong>
                        <span id="userRole">Administrador</span>
                    </div>
                    <hr>
                    <a href="#"><i class="fa-solid fa-user"></i> Meu Perfil</a>
                    <a href="login.html" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
                </div>
            </div>
        </div>
    </header>

    <div class="sub-header">
        <nav class="nav-container">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="funcionarios.html" class="nav-item">Funcionários</a>
            <a href="epis.html" class="nav-item">EPIs</a>
            <a href="entregas.html" class="nav-item">Entregas</a>
            <a href="relatorios.html" class="nav-item active">Relatórios</a>
        </nav>
    </div>

    <main class="main-container">
        <section class="panel-section">
            <h2 class="section-title">Gerar Relatório</h2>

            <form id="reportForm" class="grid" style="grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px;">
                <div>
                    <label>Período início</label>
                    <input type="date" id="periodStart" class="input">
                </div>
                <div>
                    <label>Período fim</label>
                    <input type="date" id="periodEnd" class="input">
                </div>

                <div>
                    <label>Funcionário</label>
                    <select id="reportEmployee" class="input">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div>
                    <label>EPI</label>
                    <select id="reportEpi" class="input">
                        <option value="">Todos</option>
                    </select>
                </div>

                <div style="grid-column: span 2; display:flex; justify-content:flex-end; gap:12px;">
                    <button type="button" id="generatePdf" class="btn btn-primary">Gerar PDF</button>
                    <button type="button" id="generateXlsx" class="btn">Gerar XLSX</button>
                </div>
            </form>
        </section>

        <section class="panel-section">
            <h2 class="section-title">Últimos Relatórios</h2>
            <div id="recentReports" style="margin-top:12px;"></div>
        </section>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script>
        // pequenos comportamentos para a página de relatórios
        document.getElementById('generatePdf').addEventListener('click', () => alert('Gerar PDF (a implementar)'))
        document.getElementById('generateXlsx').addEventListener('click', () => alert('Gerar XLSX (a implementar)'))
    </script>
</body>
</html>

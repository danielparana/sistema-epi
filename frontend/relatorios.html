<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - EPI Fácil</title>

    <!-- Fontes e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#0d54b4',
                            600: '#0056c6',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans antialiased">

    <!-- Cabeçalho (Padronizado) -->
    <header class="bg-white h-auto md:h-16 px-6 py-4 md:py-0 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-200 gap-4 md:gap-0">
        <div class="flex items-center gap-4">
            <span class="text-brand-500 font-semibold text-xl">EPI Fácil</span>
            <span class="text-slate-800 font-medium text-lg hidden sm:block">Sistema de Controle de EPIs</span>
        </div>
        
        <div class="flex items-center justify-between w-full md:w-auto gap-6">
            <button aria-label="Ajuda" class="text-brand-500 text-xl hover:text-brand-600 transition-colors">
                <i class="fa-regular fa-circle-question"></i>
            </button>
            
            <div class="relative group">
                <button aria-label="Configurações" aria-haspopup="true" id="settingsBtn" class="text-brand-500 text-xl hover:text-brand-600 transition-colors">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <div id="settingsDropdown" class="hidden absolute top-8 left-1/2 -translate-x-1/2 bg-white min-w-[200px] shadow-lg border border-slate-200 rounded-md z-50 py-2">
                    <a href="#" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-brand-500"><i class="fa-solid fa-sliders"></i> Preferências</a>
                    <a href="#" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-brand-500"><i class="fa-solid fa-lock"></i> Segurança</a>
                    <a href="#" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-brand-500"><i class="fa-solid fa-database"></i> Backup de Dados</a>
                </div>
            </div>

            <div class="relative group">
                <button aria-label="Perfil do Usuário" aria-haspopup="true" id="profileBtn" class="w-10 h-10 rounded-full bg-brand-500 text-white font-semibold flex items-center justify-center hover:bg-brand-600 transition-colors">
                    M
                </button>
                <div id="profileDropdown" class="hidden absolute top-12 right-0 bg-white min-w-[220px] shadow-lg border border-slate-200 rounded-md z-50 py-2">
                    <div class="px-4 py-3 flex flex-col border-b border-slate-100">
                        <strong id="userName" class="text-sm text-slate-900">Marcos</strong>
                        <span id="userRole" class="text-xs text-slate-500">Administrador</span>
                    </div>
                    <a href="#" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-brand-500 mt-1"><i class="fa-solid fa-user"></i> Meu Perfil</a>
                    <a href="login.html" class="flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Navegação Secundária -->
  <!-- Navegação Principal (Bottom Bar no Mobile, Top Bar no Desktop) -->
   

    <!-- Área Principal -->
    <main class="p-6 md:p-10 pb-24 md:pb-10 max-w-7xl mx-auto space-y-8">
        
        <!-- Painel: Filtros do Relatório -->
        <section class="bg-white rounded-xl p-6 md:p-8 border border-slate-200 shadow-sm">
            <h2 class="text-slate-900 text-xl font-medium pb-4 border-b border-slate-200 mb-6">
                Gerar Relatório
            </h2>

            <form id="reportForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Datas -->
                <div class="w-full">
                    <label for="periodStart" class="block text-sm font-medium text-slate-700 mb-2">Período início</label>
                    <input type="date" id="periodStart" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all shadow-sm bg-white">
                </div>
                <div class="w-full">
                    <label for="periodEnd" class="block text-sm font-medium text-slate-700 mb-2">Período fim</label>
                    <input type="date" id="periodEnd" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all shadow-sm bg-white">
                </div>

                <!-- Filtros (Selects) -->
                <div class="w-full">
                    <label for="reportEmployee" class="block text-sm font-medium text-slate-700 mb-2">Funcionário</label>
                    <select id="reportEmployee" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all shadow-sm bg-white">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="w-full">
                    <label for="reportEpi" class="block text-sm font-medium text-slate-700 mb-2">EPI</label>
                    <select id="reportEpi" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all shadow-sm bg-white">
                        <option value="">Todos</option>
                    </select>
                </div>

                <!-- Botões de Ação (Empilhados no mobile, Lado a lado no desktop) -->
                <div class="md:col-span-2 flex flex-col sm:flex-row justify-end items-center gap-3 pt-4 border-t border-slate-100 mt-2">
                    <button type="button" id="viewReport" class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-800 font-medium py-3 px-6 rounded-lg transition-colors order-3 sm:order-1">
                        <i class="fa-solid fa-eye mr-1"></i> Visualizar
                    </button>

                    <button type="button" id="generateXlsx" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-medium py-3 px-6 rounded-lg shadow-sm transition-colors order-2 sm:order-2">
                        <i class="fa-solid fa-file-excel mr-1"></i> Gerar XLSX
                    </button>

                    <button type="button" id="generatePdf" class="w-full sm:w-auto bg-brand-600 hover:bg-brand-700 text-white font-medium py-3 px-6 rounded-lg shadow-sm transition-colors order-1 sm:order-3">
                        <i class="fa-solid fa-file-pdf mr-1"></i> Gerar PDF
                    </button>
                </div>
            </form>
        </section>

        <!-- Painel: Resultados -->
        <section class="bg-white rounded-xl p-6 md:p-8 border border-slate-200 shadow-sm">
            <h2 class="text-slate-900 text-xl font-medium pb-4 border-b border-slate-200 mb-6">
                Resultado da Consulta
            </h2>

            <!-- Contêiner blindado com overflow-x-auto para suportar tabelas grandes -->
            <div id="reportResult" class="w-full overflow-x-auto min-h-[150px]">
                <!-- Estado vazio inicial -->
                <div class="flex flex-col items-center justify-center py-10 px-4 bg-slate-50 border border-dashed border-slate-300 rounded-lg text-slate-500">
                    <i class="fa-solid fa-clipboard-list text-4xl text-slate-300 mb-3"></i>
                    <p class="text-sm font-medium">Nenhum relatório gerado.</p>
                    <p class="text-xs mt-1">Utilize os filtros acima para iniciar a busca.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <!-- Bibliotecas de terceiros -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>    
    <script src="assets/js/report.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Relatórios - EPI Fácil</title>
</head>
<body class="bg-slate-50 min-h-screen text-gray-800">

    <!-- ==========================================
         CABEÇALHO GLOBAL (Relatórios Ativo)
         ========================================== -->
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            
            <div class="flex items-center space-x-6">
                <span class="text-[#0056D2] font-bold text-xl tracking-tight">EPI Fácil</span>
                <div class="hidden md:block h-6 border-l border-gray-300"></div>
                <h1 class="hidden md:block text-gray-700 font-semibold text-lg">Sistema de Controle de EPIs</h1>
            </div>

            <div class="flex items-center space-x-4 text-gray-500">
                <button class="hover:text-[#0056D2] transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                <button class="hover:text-[#0056D2] transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
                <button class="w-9 h-9 rounded-full bg-yellow-400 overflow-hidden border-2 border-white shadow-sm flex items-center justify-center">
                    <img src="https://raw.githubusercontent.com/tailwindlabs/tailwindcss/master/.github/logo-light.svg" alt="Avatar" class="w-full h-full object-cover">
                </button>
            </div>
        </div>

        <!-- Menu de Abas -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="flex justify-center space-x-6 md:space-x-12 overflow-x-auto">
                <a href="dashboard.html" class="py-3 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 text-sm font-medium whitespace-nowrap transition-colors">Dashboard</a>
                <a href="funcionarios.html" class="py-3 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 text-sm font-medium whitespace-nowrap transition-colors">Funcionários</a>
                <a href="#" class="py-3 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 text-sm font-medium whitespace-nowrap transition-colors">EPIs</a>
                <a href="#" class="py-3 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 text-sm font-medium whitespace-nowrap transition-colors">Entregas</a>
                
                <!-- Aba Ativa -->
                <a href="relatorios.html" class="py-3 px-1 border-b-2 border-[#0056D2] text-[#0056D2] text-sm font-semibold whitespace-nowrap">Relatórios</a>
            </nav>
        </div>
    </header>

    <!-- ==========================================
         CONTEÚDO DA PÁGINA (Relatórios)
         ========================================== -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Gerar Relatório</h2>

        <!-- Container Principal -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 md:p-10">
            
            <!-- Grid: Divide em 2 colunas no desktop, empilha no mobile -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-0">
                
                <!-- COLUNA 1: FILTROS E GERAÇÃO (Lado Esquerdo) -->
                <div class="lg:pr-10">
                    <h3 class="text-[#0056D2] font-medium text-sm mb-6 border-b border-gray-100 pb-2">Filtros</h3>
                    
                    <form action="#" class="space-y-6">
                        
                        <!-- Período (Inputs de Data) -->
                        <div class="flex flex-col sm:flex-row sm:items-center">
                            <label class="w-32 text-sm font-medium text-gray-700 mb-1 sm:mb-0">Período:</label>
                            <div class="flex items-center space-x-3 flex-1">
                                <input type="date" value="2026-03-01" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] text-sm text-gray-600">
                                <span class="text-sm text-gray-500">até</span>
                                <input type="date" value="2026-03-31" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] text-sm text-gray-600">
                            </div>
                        </div>

                        <!-- Funcionários (Select) -->
                        <div class="flex flex-col sm:flex-row sm:items-center">
                            <label class="w-32 text-sm font-medium text-gray-700 mb-1 sm:mb-0">Funcionários:</label>
                            <select class="flex-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] text-sm text-gray-600 bg-white">
                                <option value="">Selecione o funcionário</option>
                                <option value="todos">Todos os Funcionários</option>
                            </select>
                        </div>

                        <!-- EPIs (Select) -->
                        <div class="flex flex-col sm:flex-row sm:items-center">
                            <label class="w-32 text-sm font-medium text-gray-700 mb-1 sm:mb-0">EPI:</label>
                            <select class="flex-1 w-full sm:max-w-[250px] px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] text-sm text-gray-600 bg-white">
                                <option value="">Selecione o tipo de EPI</option>
                                <option value="todos">Todos os EPIs</option>
                            </select>
                        </div>

                        <!-- Botão Principal -->
                        <div class="pt-4 flex justify-center sm:justify-start sm:pl-32">
                            <button type="button" class="bg-[#0056D2] hover:bg-blue-800 text-white font-semibold py-2.5 px-8 rounded-md shadow-sm transition-colors text-sm w-full sm:w-auto">
                                Gerar Relatório
                            </button>
                        </div>

                        <!-- Botões de Exportação Global -->
                        <div class="pt-6 flex flex-col sm:flex-row justify-center sm:justify-start sm:pl-32 gap-4">
                            <!-- Exportar PDF -->
                            <button type="button" class="flex items-center justify-center space-x-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-700 py-2 px-4 rounded-md transition-colors text-sm w-full sm:w-auto">
                                <svg class="w-4 h-4 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path></svg>
                                <span>Exportar em PDF</span>
                            </button>
                            <!-- Exportar Excel -->
                            <button type="button" class="flex items-center justify-center space-x-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-700 py-2 px-4 rounded-md transition-colors text-sm w-full sm:w-auto">
                                <svg class="w-4 h-4 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path></svg>
                                <span>Exportar em XLXS</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- COLUNA 2: HISTÓRICO (Lado Direito) -->
                <!-- lg:border-l cria a linha vertical separando os contextos apenas no desktop -->
                <div class="lg:border-l lg:border-gray-100 lg:pl-10 pt-10 lg:pt-0">
                    <h3 class="text-[#0056D2] font-medium text-sm mb-6 border-b border-gray-100 pb-2">Últimos Gerados</h3>
                    
                    <ul class="space-y-6">
                        <!-- Item do Histórico 1 -->
                        <li class="pb-6 border-b border-gray-50 last:border-0 last:pb-0">
                            <p class="text-sm text-gray-600 mb-3">09/04/2026 20:00 por Juliana Santana</p>
                            <div class="flex space-x-3">
                                <button class="flex items-center space-x-1.5 bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-600 py-1.5 px-3 rounded text-xs font-medium transition-colors">
                                    <span class="w-3 h-3 bg-red-500 rounded-sm inline-block"></span>
                                    <span>Exportar em PDF</span>
                                </button>
                                <button class="flex items-center space-x-1.5 bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-600 py-1.5 px-3 rounded text-xs font-medium transition-colors">
                                    <span class="w-3 h-3 bg-green-600 rounded-sm inline-block"></span>
                                    <span>Exportar em XLXS</span>
                                </button>
                            </div>
                        </li>

                        <!-- Item do Histórico 2 -->
                        <li class="pb-6 border-b border-gray-50 last:border-0 last:pb-0">
                            <p class="text-sm text-gray-600 mb-3">09/04/2026 15:00 por Danilo Silva</p>
                            <div class="flex space-x-3">
                                <button class="flex items-center space-x-1.5 bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-600 py-1.5 px-3 rounded text-xs font-medium transition-colors">
                                    <span class="w-3 h-3 bg-red-500 rounded-sm inline-block"></span>
                                    <span>Exportar em PDF</span>
                                </button>
                                <button class="flex items-center space-x-1.5 bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-600 py-1.5 px-3 rounded text-xs font-medium transition-colors">
                                    <span class="w-3 h-3 bg-green-600 rounded-sm inline-block"></span>
                                    <span>Exportar em XLXS</span>
                                </button>
                            </div>
                        </li>

                        <!-- Item do Histórico 3 -->
                        <li class="pb-6 border-b border-gray-50 last:border-0 last:pb-0">
                            <p class="text-sm text-gray-600 mb-3">09/04/2026 15:00 por Gustavo Alves</p>
                            <div class="flex space-x-3">
                                <button class="flex items-center space-x-1.5 bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-600 py-1.5 px-3 rounded text-xs font-medium transition-colors">
                                    <span class="w-3 h-3 bg-red-500 rounded-sm inline-block"></span>
                                    <span>Exportar em PDF</span>
                                </button>
                                <button class="flex items-center space-x-1.5 bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-600 py-1.5 px-3 rounded text-xs font-medium transition-colors">
                                    <span class="w-3 h-3 bg-green-600 rounded-sm inline-block"></span>
                                    <span>Exportar em XLXS</span>
                                </button>
                            </div>
                        </li>
                    </ul>

                </div>
            </div>

        </div>
    </main>

</body>
</html>

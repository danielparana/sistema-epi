<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregas - EPI Fácil</title>

    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-left">
            <span class="logo-text">EPI Fácil</span>
            <span class="system-title">Sistema de Controle de EPIs</span>
        </div>
        <div class="header-right">
            <i class="fa-regular fa-circle-question header-icon" title="Ajuda"></i>
            <div class="dropdown-wrapper">
                <i class="fa-solid fa-gear header-icon" id="settingsBtn" title="Configurações"></i>
                <div class="dropdown-menu" id="settingsDropdown">
                    <a href="#"><i class="fa-solid fa-sliders"></i> Preferências</a>
                    <a href="#"><i class="fa-solid fa-lock"></i> Segurança</a>
                    <a href="#"><i class="fa-solid fa-database"></i> Backup de Dados</a>
                </div>
            </div>
            <div class="dropdown-wrapper">
                <div class="user-avatar" id="profileBtn" title="Perfil do Usuário"></div>
                <div class="dropdown-menu dropdown-right" id="profileDropdown">
                    <div class="user-info-header">
                        <strong id="userName">João Silva</strong>
                        <span id="userRole">Administrador</span>
                    </div>
                    <hr>
                    <a href="#"><i class="fa-solid fa-user"></i> Meu Perfil</a>
                    <a href="login.html" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
                </div>
            </div>
        </div>
    </header>

    <div class="sub-header">
        <nav class="nav-container">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="funcionarios.html" class="nav-item">Funcionários</a>
            <a href="epis.html" class="nav-item">EPIs</a>
            <a href="entregas.html" class="nav-item active">Entregas</a>
            <a href="relatorios.html" class="nav-item">Relatórios</a>
        </nav>
    </div>

    <main class="main-container">
        <section class="panel-section">
            <h2 class="section-title">Registrar Entrega</h2>
            <form id="deliveryForm" class="grid" style="grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px;">
                <div>
                    <label class="text-sm font-medium text-gray-700">Funcionário</label>
                    <select id="employeeSelect" class="input" required>
                        <option value="">Carregando funcionários...</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700">EPI</label>
                    <select id="epiSelect" class="input" required>
                        <option value="">Carregando EPIs...</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700">Lote</label>
                    <input id="selectedLot" type="text" class="input" placeholder="Lote selecionado" readonly>
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700">Quantidade</label>
                    <input id="quantityInput" type="number" min="1" value="1" class="input" required>
                </div>
                <div style="grid-column: span 2; display:flex; justify-content:flex-end; gap:10px; align-items:center;">
                    <span id="stockInfo" style="color:#6b7280; font-size:0.95rem;"></span>
                    <button type="submit" class="btn btn-primary">Registrar Entrega</button>
                </div>
            </form>
        </section>

        <section class="panel-section">
            <h2 class="section-title">Entregas registradas</h2>
            <div style="overflow-x:auto; margin-top:20px;">
                <table style="width:100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:left;">ID</th>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:left;">Funcionário</th>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:left;">EPI</th>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:left;">Lote</th>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:left;">Quantidade</th>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:left;">Data/Hora</th>
                        </tr>
                    </thead>
                    <tbody id="deliveryTable"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/entregas.js"></script>
</body>
</html>

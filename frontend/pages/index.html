  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      
      <!-- Tailwind v4 -->
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      
      <title>Plataforma de Gestão</title>
  </head>
  <body class="bg-[#4361ee] min-h-screen overflow-hidden">
      
  <!-- Header Sincronizado: Atualizado para max-w-7xl e px-6 -->
  <header class="fixed w-full z-50 sm:top-0 md:top-5 flex justify-center px-0 md:px-10 transition-all duration-300">
      <!-- A correção estrutural está aqui: w-full max-w-7xl -->
      <div class="w-full max-w-7xl  shadow-lg md:rounded-md overflow-hidden">
          <nav class="bg-[#3f37c9]">
              <!-- px-6 para alinhar exatamente com o px-6 do main -->
              <div class="w-full px-6 py-3 mx-auto">
                  <div class="flex items-center justify-between w-full">
                      
                      <!-- Lado Esquerdo: Links -->
                      <ul class="hidden md:flex flex-row font-medium mt-0 space-x-8 text-sm text-white">
                          <li><a href="#" class="hover:text-blue-200 transition-colors" aria-current="page">Home</a></li>
                          <li><a href="#" class="hover:text-blue-200 transition-colors">Company</a></li>
                          <li><a href="#" class="hover:text-blue-200 transition-colors">Team</a></li>
                      </ul>

                      <!-- Lado Direito: Botão -->
                      <div class="flex items-center">
      <!-- Adicionado: border e border-white -->
      <button type="button" class="bg-[#3f37c9] hover:bg-gray-900 text-white font-bold py-2.5 px-6 rounded-lg border border-white shadow-md transition-all duration-200">
          Entrar
      </button> 
  </div>
                      
                  </div>
              </div>
          </nav>
      </div>
  </header>

  <!-- Hero Section Sincronizada: max-w-7xl e px-6 -->
  <main class="relative w-full pt-25 pb-0 overflow-hidden flex justify-center px-0 md:px-10">
      
      <!-- O container de limite bate exatamente com o limite do header -->
      <div class="w-full max-w-7xl px-6">
          <div class="flex flex-col md:flex-row justify-between items-center md:items-stretch">

              <!-- Lado Esquerdo: Tipografia e CTA -->
              <div class="w-full md:w-1/2 flex flex-col justify-center text-left py-12 md:py-24 z-10">
                  <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-white leading-tight mb-4">
                      Acesse a melhor plataforma para controle de <span class="text-yellow-400">EPI's</span>
                  </h1>
                  <p class="text-lg md:text-xl text-blue-100 mb-8 max-w-lg">
                      Gerencie os EPI's da sua empresa
                  </p>
                  <div>
                      <button type="button" class="bg-[#3f37c9] text-white font-bold py-3.5 px-8 rounded-lg shadow-md hover:bg-gray-900 hover:shadow-lg transition-all duration-200">
                          Agendar uma demonstração
                      </button>
                  </div>
              </div>

              <!-- Lado Direito: Imagem -->
              <div class="w-full md:w-1/2 flex justify-center md:justify-end items-end relative mt-8 md:mt-0">
                  <img 
                      src="/assets/worker.png" 
                      alt="Profissional" 
                      class="relative z-10 w-full max-w-md lg:max-w-lg object-contain object-bottom drop-shadow-2xl"
                      style="max-height: 500px;"
                  >
              </div>

          </div>
      </div>
  </main>

  <!-- Flowbite JS -->
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.js"></script>

  </body>
  </html>

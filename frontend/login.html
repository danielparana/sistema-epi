<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EPI Fácil</title>

    <!-- Fontes e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#0d54b4',
                            600: '#0056c6',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans antialiased flex items-center justify-center p-4 md:p-0">

    <main class="w-full max-w-md">

        <!-- Card de Login -->
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
            
            <!-- Cabeçalho -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-brand-50 rounded-xl text-brand-600 mb-4">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Sistema EPI</h1>
                <p class="text-slate-500 text-sm mt-2">Faça login para acessar a plataforma</p>
            </div>

            <!-- Formulário -->
            <form id="loginForm" class="space-y-5">

                <!-- Campo E-mail -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all shadow-sm"
                        placeholder="seu@email.com"
                        required
                    >
                </div>

                <!-- Campo Senha -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-sm font-medium text-slate-700">Senha</label>
                        <!-- Adição opcional de link para recuperar senha, muito comum em sistemas corporativos -->
                        <a href="#" class="text-xs font-medium text-brand-600 hover:text-brand-700 transition-colors">Esqueceu a senha?</a>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all shadow-sm"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <!-- Botão Entrar -->
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-3 px-4 rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar
                </button>

            </form>

            <!-- Mensagem de Erro Dinâmica -->
            <span id="message" class="block text-center text-sm text-red-600 font-medium mt-4 hidden" aria-live="polite"></span>

        </div>

    </main>

   <script src="assets/js/api.js"></script>
   <script src="assets/js/login.js"></script>

</body>
</html>

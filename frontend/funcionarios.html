<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários - EPI Fácil</title>

    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-left">
            <span class="logo-text">EPI Fácil</span>
            <span class="system-title">Sistema de Controle de EPIs</span>
        </div>
        <div class="header-right">
            <i class="fa-regular fa-circle-question header-icon" title="Ajuda"></i>
            <div class="dropdown-wrapper">
                <i class="fa-solid fa-gear header-icon" id="settingsBtn" title="Configurações"></i>
                <div class="dropdown-menu" id="settingsDropdown">
                    <a href="#"><i class="fa-solid fa-sliders"></i> Preferências</a>
                    <a href="#"><i class="fa-solid fa-lock"></i> Segurança</a>
                    <a href="#"><i class="fa-solid fa-database"></i> Backup de Dados</a>
                </div>
            </div>
            <div class="dropdown-wrapper">
                <div class="user-avatar" id="profileBtn" title="Perfil do Usuário"></div>
                <div class="dropdown-menu dropdown-right" id="profileDropdown">
                    <div class="user-info-header">
                        <strong id="userName">João Silva</strong>
                        <span id="userRole">Administrador</span>
                    </div>
                    <hr>
                    <a href="#"><i class="fa-solid fa-user"></i> Meu Perfil</a>
                    <a href="login.html" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
                </div>
            </div>
        </div>
    </header>

    <div class="sub-header">
        <nav class="nav-container">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="funcionarios.html" class="nav-item active">Funcionários</a>
            <a href="epis.html" class="nav-item">EPIs</a>
            <a href="entregas.html" class="nav-item">Entregas</a>
            <a href="relatorios.html" class="nav-item">Relatórios</a>
        </nav>
    </div>

    <main class="main-container">
        <section class="panel-section">
            <h2 class="section-title">Cadastro de Funcionário</h2>
            <form id="employeeForm" class="form-grid" style="margin-top: 20px;">
                <input type="text" id="nome" class="input" placeholder="Nome" required>
                <input type="text" id="cpf" class="input" placeholder="CPF (formato: 000.000.000-00)" required>
                <input type="text" id="cargo" class="input" placeholder="Cargo" required>
                <div class="form-actions form-full-width">
                    <button type="submit" class="btn btn-primary" style="width:100%;">Cadastrar Funcionário</button>
                </div>
                <small id="cpfError" style="color: red; grid-column: span 2; display: none;"></small>
            </form>
        </section>

        <section class="panel-section">
            <h2 class="section-title">Funcionários Cadastrados</h2>
            <div style="overflow-x:auto; margin-top:20px;">
                <table style="width:100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:left;">ID</th>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:left;">Nome</th>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:left;">CPF</th>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:left;">Cargo</th>
                            <th style="padding: 14px; border-bottom: 1px solid #e1e5eb; text-align:center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTable"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/funcionarios.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tailwind v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <title>Funcionários - EPI Fácil</title>
</head>
<body class="bg-slate-50 min-h-screen text-gray-800">

    <!-- ==========================================
         CABEÇALHO GLOBAL
         ========================================== -->
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            
            <div class="flex items-center space-x-6">
                <span class="text-[#0056D2] font-bold text-xl tracking-tight">EPI Fácil</span>
                <div class="hidden md:block h-6 border-l border-gray-300"></div>
                <h1 class="hidden md:block text-gray-700 font-semibold text-lg">Sistema de Controle de EPIs</h1>
            </div>

            <div class="flex items-center space-x-4 text-gray-500">
                <button class="hover:text-[#0056D2] transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                <button class="hover:text-[#0056D2] transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
                <button class="w-9 h-9 rounded-full bg-yellow-400 overflow-hidden border-2 border-white shadow-sm flex items-center justify-center">
                    <img src="https://raw.githubusercontent.com/tailwindlabs/tailwindcss/master/.github/logo-light.svg" alt="Avatar" class="w-full h-full object-cover">
                </button>
            </div>
        </div>

        <!-- Menu de Abas (Atualizado: 'Funcionários' agora é o ativo) -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="flex justify-center space-x-6 md:space-x-12 overflow-x-auto">
                <a href="dashboard.html" class="py-3 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 text-sm font-medium whitespace-nowrap transition-colors">Dashboard</a>
                
                <!-- Aba Ativa -->
                <a href="funcionarios.html" class="py-3 px-1 border-b-2 border-[#0056D2] text-[#0056D2] text-sm font-semibold whitespace-nowrap">Funcionários</a>
                
                <a href="#" class="py-3 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 text-sm font-medium whitespace-nowrap transition-colors">EPIs</a>
                <a href="#" class="py-3 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 text-sm font-medium whitespace-nowrap transition-colors">Entregas</a>
                <a href="#" class="py-3 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 text-sm font-medium whitespace-nowrap transition-colors">Relatórios</a>
            </nav>
        </div>
    </header>

    <!-- ==========================================
         CONTEÚDO DA PÁGINA (Cadastro)
         ========================================== -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Cadastrar Funcionário</h2>

        <!-- Container do Formulário -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 md:p-10">
            <form action="#" method="POST">
                
                <!-- Grid Principal: Divide em duas colunas no desktop (lg:grid-cols-2) -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    
                    <!-- COLUNA 1: DADOS PESSOAIS -->
                    <div>
                        <!-- Título da Seção -->
                        <h3 class="text-[#0056D2] font-medium text-sm mb-6 border-b border-gray-100 pb-2">Dados Pessoais</h3>
                        
                        <div class="space-y-5">
                            <!-- Input Horizontal: Nome -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-1 sm:mb-0">Nome Completo:</label>
                                <input type="text" placeholder="Nome Completo" class="flex-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] focus:border-[#0056D2] text-sm transition-colors">
                            </div>

                            <!-- Input Horizontal: CPF -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-1 sm:mb-0">CPF:</label>
                                <input type="text" placeholder="Ex: 99999999999" class="flex-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] focus:border-[#0056D2] text-sm transition-colors">
                            </div>

                            <!-- Input Horizontal: Data de Nascimento -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-1 sm:mb-0">Data de Nascimento:</label>
                                <input type="text" placeholder="__/__/____" class="flex-1 w-full sm:max-w-[150px] px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] focus:border-[#0056D2] text-sm transition-colors">
                            </div>

                            <!-- Input Horizontal: Matrícula -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-1 sm:mb-0">Matrícula:</label>
                                <input type="text" class="flex-1 w-full sm:max-w-[200px] px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] focus:border-[#0056D2] text-sm transition-colors">
                            </div>

                            <!-- Input Horizontal: Telefone -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-1 sm:mb-0">Telefone:</label>
                                <input type="text" class="flex-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] focus:border-[#0056D2] text-sm transition-colors">
                            </div>

                            <!-- Input Horizontal: Logradouro -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-1 sm:mb-0">Logradouro:</label>
                                <input type="text" class="flex-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] focus:border-[#0056D2] text-sm transition-colors">
                            </div>
                        </div>
                    </div>

                    <!-- COLUNA 2: DADOS PROFISSIONAIS & SEGURANÇA -->
                    <div>
                        <!-- Título da Seção -->
                        <h3 class="text-[#0056D2] font-medium text-sm mb-6 border-b border-gray-100 pb-2">Dados Profissionais</h3>
                        
                        <div class="space-y-5 mb-10">
                            <!-- Input Horizontal: Cargo -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-1 sm:mb-0">Cargo:</label>
                                <input type="text" class="flex-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] focus:border-[#0056D2] text-sm transition-colors">
                            </div>

                            <!-- Input Horizontal: Data da Admissão -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-1 sm:mb-0">Data da Admissão:</label>
                                <input type="text" placeholder="__/__/____" class="flex-1 w-full sm:max-w-[150px] px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] focus:border-[#0056D2] text-sm transition-colors">
                            </div>

                            <!-- Input Horizontal: Setor -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-1 sm:mb-0">Setor:</label>
                                <input type="text" class="flex-1 w-full sm:max-w-[200px] px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#0056D2] focus:border-[#0056D2] text-sm transition-colors">
                            </div>

                            <!-- Radio Group: Status -->
                            <div class="flex flex-col sm:flex-row sm:items-center pt-2">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-2 sm:mb-0">Status:</label>
                                <div class="flex items-center space-x-6">
                                    <label class="flex items-center cursor-pointer">
                                        <input type="radio" name="status" value="ativo" class="w-4 h-4 text-[#0056D2] border-gray-300 focus:ring-[#0056D2]" checked>
                                        <span class="ml-2 text-sm text-gray-700">Ativo</span>
                                    </label>
                                    <label class="flex items-center cursor-pointer">
                                        <input type="radio" name="status" value="inativo" class="w-4 h-4 text-[#0056D2] border-gray-300 focus:ring-[#0056D2]">
                                        <span class="ml-2 text-sm text-gray-400">Inativo</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Título da Seção: Segurança -->
                        <h3 class="text-[#0056D2] font-medium text-sm mb-6 border-b border-gray-100 pb-2">Informações de Segurança</h3>
                        
                        <div class="space-y-4">
                            <!-- Radio Group: Função de Risco -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-2 sm:mb-0">Função de Risco?</label>
                                <div class="flex items-center space-x-6">
                                    <label class="flex items-center cursor-pointer">
                                        <input type="radio" name="risco" value="sim" class="w-4 h-4 text-[#0056D2] border-gray-300 focus:ring-[#0056D2]" checked>
                                        <span class="ml-2 text-sm text-gray-700">Sim</span>
                                    </label>
                                    <label class="flex items-center cursor-pointer">
                                        <input type="radio" name="risco" value="nao" class="w-4 h-4 text-[#0056D2] border-gray-300 focus:ring-[#0056D2]">
                                        <span class="ml-2 text-sm text-gray-400">Não</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Radio Group: Necessita de EPI -->
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <label class="w-40 text-sm font-medium text-gray-700 mb-2 sm:mb-0">Necessita de EPI?</label>
                                <div class="flex items-center space-x-6">
                                    <label class="flex items-center cursor-pointer">
                                        <input type="radio" name="epi" value="sim" class="w-4 h-4 text-[#0056D2] border-gray-300 focus:ring-[#0056D2]" checked>
                                        <span class="ml-2 text-sm text-gray-700">Sim</span>
                                    </label>
                                    <label class="flex items-center cursor-pointer">
                                        <input type="radio" name="epi" value="nao" class="w-4 h-4 text-[#0056D2] border-gray-300 focus:ring-[#0056D2]">
                                        <span class="ml-2 text-sm text-gray-400">Não</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Footer do Formulário (Botões de Ação) -->
                <div class="mt-12 pt-6 border-t border-gray-100 flex flex-col-reverse sm:flex-row justify-center items-center gap-4">
                    <button type="button" class="w-full sm:w-auto px-8 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold rounded-md transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="w-full sm:w-auto px-8 py-2.5 bg-[#0056D2] hover:bg-blue-800 text-white text-sm font-semibold rounded-md shadow-sm transition-colors">
                        Cadastrar Funcionário
                    </button>
                </div>

            </form>
        </div>

    </main>

</body>
</html>
